<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Slide - Next Steps</title>
  <script src="../lib/tailwind@4.js"></script>
  <link href="../lib/font-awesome/all.min.css" rel="stylesheet" />
  <link href="../lib/fonts.css" rel="stylesheet" />
</head>

<body>
  <div id="page-shell" class="w-screen h-screen flex items-center justify-center bg-gray-900">
    <div id="slide-scale-wrapper" class="relative w-[1280px] h-[720px]">
      <div id="slide-container"
        class="w-[1280px] h-[720px] box-border flex flex-col relative overflow-hidden bg-[#F8F9FA] p-10">

        <!-- Global Layer: 背景装饰 -->
        <div
          class='absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-b from-red-500/5 to-transparent rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 z-0 pointer-events-none'>
        </div>

        <!-- Header Area -->
        <header class="relative z-20 mb-8 shrink-0 flex flex-col gap-2 items-start">
          <h1 class="text-3xl font-bold tracking-tight text-gray-900 mb-2">
            下一步行动
          </h1>
        </header>

        <!-- Main Content Area -->
        <main class="relative z-20 flex-1 min-h-0 w-full">
          <div class="grid grid-cols-12 gap-8 h-full">

            <!-- Left Column: Action Timeline (左侧行动项，保持不变，占比7/12) -->
            <div class="col-span-7 flex flex-col justify-center gap-5">

              <!-- Item 1: High Urgency -->
              <div
                class="group relative bg-white rounded-xl p-5 shadow-sm border border-gray-200 hover:border-red-200 transition-all duration-300">
                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-[#C00000] rounded-l-xl"></div>
                <div class="flex items-start gap-4">
                  <div
                    class="flex-shrink-0 w-12 h-12 rounded-lg bg-red-50 flex items-center justify-center text-[#C00000]">
                    <i class="fa-solid fa-qrcode text-2xl"></i>
                  </div>
                  <div class="flex-1">
                    <div class="flex items-baseline justify-between mb-1">
                      <h3 class="text-xl font-bold text-gray-900">即刻行动</h3>
                      <span class="px-2 py-1 rounded text-xs font-bold bg-red-100 text-red-700">优先级：高</span>
                    </div>
                    <p class="text-gray-600 text-lg leading-relaxed">
                      拿出手机，扫码加入<span class="font-semibold text-gray-900">“严料坊&影刀RPA项目群”</span>。
                    </p>
                  </div>
                </div>
              </div>

              <!-- Item 2 -->
              <div class="group relative bg-white rounded-xl p-5 shadow-sm border border-gray-200">
                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-red-400/80 rounded-l-xl"></div>
                <div class="flex items-start gap-4">
                  <div
                    class="flex-shrink-0 w-12 h-12 rounded-lg bg-gray-50 flex items-center justify-center text-gray-600">
                    <i class="fa-solid fa-list-check text-xl"></i>
                  </div>
                  <div class="flex-1">
                    <div class="flex items-baseline justify-between mb-1">
                      <h3 class="text-xl font-bold text-gray-900">本周三前</h3>
                    </div>
                    <p class="text-gray-600 text-lg leading-relaxed">
                      完成需求优先级评估，针对高优先级需求，开始梳理详细流程。
                    </p>
                  </div>
                </div>
              </div>

              <!-- Item 3 -->
              <div class="group relative bg-white rounded-xl p-5 shadow-sm border border-gray-200">
                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-red-200/80 rounded-l-xl"></div>
                <div class="flex items-start gap-4">
                  <div
                    class="flex-shrink-0 w-12 h-12 rounded-lg bg-gray-50 flex items-center justify-center text-gray-600">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                  </div>
                  <div class="flex-1">
                    <div class="flex items-baseline justify-between mb-1">
                      <h3 class="text-xl font-bold text-gray-900">下周五前</h3>
                    </div>
                    <p class="text-gray-600 text-lg leading-relaxed">
                      首批骨干成员完成线上<span class="font-semibold text-gray-900">初级课程</span>学习。
                    </p>
                  </div>
                </div>
              </div>

            </div>

            <!-- Right Column: Dual QR Codes (右侧改为上下双卡片结构，占比5/12) -->
            <div class="col-span-5 flex flex-col h-full gap-5">

              <!-- QR Card 1: Project Group -->
              <div
                class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 p-4 flex flex-row items-center gap-6 relative overflow-hidden group hover:shadow-md hover:border-red-100 transition-all duration-300">
                <!-- Decorative bg pattern -->
                <div
                  class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiNDMDAwMDAiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-50">
                </div>

                <!-- QR Image Area -->
                <div
                  class="relative z-10 w-40 h-40 shrink-0 bg-white border border-gray-100 rounded-xl p-2 shadow-sm flex items-center justify-center">
                  <img
                    src="https://winrobot-ai-power.yingdao.com/33aebb43-cc64-11ed-91ab-0242ac1b0002/enterprise/edd70664-a35e-4ae4-8cd1-cbe5b9b823ae/c8b70e15fe4fac5571e438b2648fbf811250f9a8b5fe5ed50f46f5bd2bd04b4b.jpg"
                    alt="项目群二维码" class="w-full h-full object-contain">
                </div>

                <!-- Text Info -->
                <div class="relative z-10 flex-1 flex flex-col justify-center items-start">
                  <h3 class="text-xl font-bold text-[#C00000] mb-1">扫码加入项目群</h3>
                  <p class="text-gray-500 text-sm leading-tight mb-3">开启严料坊<br>自动化之旅</p>
                  <span
                    class="inline-flex items-center gap-1 bg-red-50 text-red-700 text-xs px-2 py-1 rounded font-medium">
                    <i class="fa-solid fa-users"></i> 项目群
                  </span>
                </div>
              </div>

              <!-- QR Card 2: 10-Day Bootcamp (New Added) -->
              <div
                class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 p-4 flex flex-row items-center gap-6 relative overflow-hidden group hover:shadow-md hover:border-blue-100 transition-all duration-300">
                <!-- Decorative bg pattern (Blue tint for distinction) -->
                <div
                  class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiMwMDVQQ0MiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-50">
                </div>

                <!-- QR Image Area (Empty Placeholder) -->
                <div
                  class="relative z-10 w-40 h-40 shrink-0 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center text-gray-400">
                  <!-- 占位符：用户后续自行替换 img src -->
                  <i class="fa-solid fa-qrcode text-3xl mb-2"></i>
                  <span class="text-xs">二维码预留位</span>
                </div>

                <!-- Text Info -->
                <div class="relative z-10 flex-1 flex flex-col justify-center items-start">
                  <h3 class="text-xl font-bold text-gray-800 mb-1 group-hover:text-blue-600 transition-colors">
                    RPA新手<br>10天训练营</h3>
                  <p class="text-gray-500 text-sm leading-tight mb-3">从零基础<br>到独立开发</p>
                  <span
                    class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded font-medium">
                    <i class="fa-solid fa-rocket"></i> 训练营
                  </span>
                </div>
              </div>

            </div>

          </div>
        </main>

      </div>
    </div>
  </div>

  <script src="../js/slide-core.js"></script>
</body>

</html>
