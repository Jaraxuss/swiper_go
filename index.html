<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Presentation</title>
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        html,
        body {
            position: relative;
            height: 100%;
        }

        body {
            background: #000;
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #000;
            margin: 0;
            padding: 0;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            text-align: center;
            font-size: 18px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .swiper-slide iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Custom navigation button styles */
        .swiper-button-next,
        .swiper-button-prev {
            color: #fff;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .swiper-button-next:hover,
        .swiper-button-prev:hover {
            opacity: 1;
        }

        .swiper-pagination-bullet {
            background: #fff;
        }
    </style>
</head>

<body>
    <!-- Swiper -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="swiper-wrapper">
            <!-- Slides will be injected here -->
        </div>
        <!-- Add Pagination -->
        <div class="swiper-pagination"></div>
        <!-- Add Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
        // List of pages to display
        const pages = [
            "pages/1 宣讲会背景及目的.html",
            "pages/2 启动会首页.html",
            "pages/3 院长致辞.html",
            "pages/直播自动化.html",
        ];

        const wrapper = document.getElementById('swiper-wrapper');

        // Dynamically create slides
        pages.forEach(page => {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            const iframe = document.createElement('iframe');
            iframe.src = encodeURI(page);
            slide.appendChild(iframe);
            wrapper.appendChild(slide);
        });

        const swiper = new Swiper(".mySwiper", {
            mousewheel: true,
            keyboard: {
                enabled: true,
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            // 切换为淡入淡出效果
            effect: 'fade',
            fadeEffect: {
                crossFade: true
            },
            speed: 800, // 设置切换速度，让动画更丝滑
            on: {
                // 初始化时，确保第一个 iframe 获得焦点
                init: function () {
                    setTimeout(() => {
                        const activeSlide = this.slides[this.activeIndex];
                        const iframe = activeSlide.querySelector('iframe');
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.focus();
                        }
                    }, 500); // 稍微延迟，等 iframe 加载完成
                },
                // 每当切换动画结束，自动把焦点给到当前的 iframe
                slideChangeTransitionEnd: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    const iframe = activeSlide.querySelector('iframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.focus();
                    }
                }
            }
        });

        // 监听来自 iframe 的消息，实现跨页面翻页控制
        window.addEventListener('message', (event) => {
            if (event.data.type === 'SWIPER_NEXT') {
                swiper.slideNext();
            } else if (event.data.type === 'SWIPER_PREV') {
                swiper.slidePrev();
            }
        });
    </script>
</body>

</html>
