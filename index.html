<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Presentation</title>
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="lib/swiper-bundle.min.css" />
    <style>
        html,
        body {
            position: relative;
            height: 100%;
        }

        body {
            background: #000;
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #000;
            margin: 0;
            padding: 0;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            text-align: center;
            font-size: 18px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .swiper-slide iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Custom navigation button styles */
        .swiper-button-next,
        .swiper-button-prev {
            color: #fff;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .swiper-button-next:hover,
        .swiper-button-prev:hover {
            opacity: 1;
        }

        .swiper-pagination-bullet {
            background: #fff;
        }

        /* Page Overview Dock Styles */
        #dock-trigger {
            position: fixed;
            right: 0;
            top: 20%;
            height: 60%;
            width: 50px;
            z-index: 9998;
            /* background: rgba(255, 0, 0, 0.1); Debugging */
        }

        #page-dock {
            position: fixed;
            right: 20px;
            top: 50%;
            /* Ghost Strategy: Always in position, just invisible */
            transform: translateY(-50%);
            opacity: 0.01;
            pointer-events: none;

            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            z-index: 9999;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            align-items: center;

            will-change: opacity;
        }

        #page-dock.active {
            opacity: 1;
            pointer-events: auto;
        }

        .dock-item {
            position: relative;
            /* Base dimensions: 60px * 16:9 = 33.75 */
            --scale: 1;
            /* Use a variable for width/height */
            width: calc(60px * var(--scale));
            height: calc(33.75px * var(--scale));
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            /* Remove transition for width/height to follow mouse instantly */
            /* transition: width 0.1s ease, height 0.1s ease; */
            transform-origin: center right;
            flex-shrink: 0;
            border: 1px solid #666;

            /* Performance */
            will-change: width, height;
        }

        /* Ghost Strategy for Items: Keep them rendered but invisible */
        .dock-item.item-hidden {
            position: absolute;
            left: 10px;
            top: 10px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -1;
            /* Ensure dimensions are kept for browser painting */
            width: 60px;
            height: 33.75px;
            margin: 0;
            border: none;
        }

        /* Tooltip for page name */
        .dock-item::after {
            content: attr(data-title);
            position: absolute;
            right: 120%;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .dock-item:hover::after {
            opacity: 1;
        }

        .dock-item.current-page {
            border: 2px solid #007aff;
        }

        .dock-item iframe {
            width: 1280px;
            height: 720px;
            border: none;
            pointer-events: none;
            transform-origin: 0 0;

            /* 
               Base Scale needed to fit 1280 into 60px: 60 / 1280 = 0.046875 
               Total Scale = Base Scale * Dock Scale
            */
            transform: scale(calc(0.046875 * var(--scale)));

            /* Performance */
            will-change: transform;
        }
    </style>
</head>

<body>
    <!-- Swiper -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="swiper-wrapper">
            <!-- Slides will be injected here -->
        </div>
        <!-- Add Pagination -->
        <div class="swiper-pagination"></div>
        <!-- Add Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <!-- Config JS -->
    <div id="dock-trigger"></div>
    <div id="page-dock">
        <!-- Dock items injected here -->
    </div>

    <!-- Config JS -->
    <script src="js/config.js"></script>

    <!-- Swiper JS -->
    <script src="lib/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
        const wrapper = document.getElementById('swiper-wrapper');

        // Dynamically create slides using global slideConfig
        if (typeof slideConfig !== 'undefined') {
            slideConfig.forEach(page => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                const iframe = document.createElement('iframe');
                iframe.src = encodeURI(page);
                slide.appendChild(iframe);
                wrapper.appendChild(slide);
            });
        }

        const swiper = new Swiper(".mySwiper", {
            mousewheel: true,
            keyboard: {
                enabled: true,
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            // 切换为淡入淡出效果
            effect: 'fade',
            fadeEffect: {
                crossFade: true
            },
            speed: 800, // 设置切换速度，让动画更丝滑
            on: {
                // 初始化时
                init: function () {
                    setTimeout(() => {
                        const activeSlide = this.slides[this.activeIndex];
                        const iframe = activeSlide.querySelector('iframe');
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.focus();
                        }
                        updateDock(); // Initial populate
                    }, 500);
                },
                // Slide changes
                slideChange: function () {
                    updateDock(); // Update dock on slide change
                },
                slideChangeTransitionEnd: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    const iframe = activeSlide.querySelector('iframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.focus();
                    }
                }
            }
        });

        // 监听来自 iframe 的消息，实现跨页面翻页控制
        window.addEventListener('message', (event) => {
            if (event.data.type === 'SWIPER_NEXT') {
                swiper.slideNext();
            } else if (event.data.type === 'SWIPER_PREV') {
                swiper.slidePrev();
            }
        });

        /* --- Page Overview Dock Implementation (Ghost Strategy) --- */
        const dockTrigger = document.getElementById('dock-trigger');
        const pageDock = document.getElementById('page-dock');
        let dockTimeout;

        // Persistent Pool: All items are created ONCE and kept alive.
        const dockItemsPool = [];

        function initDockPool() {
            if (typeof slideConfig === 'undefined') return;

            slideConfig.forEach((pageUrl, i) => {
                const pageTitle = pageUrl.split('/').pop().replace('.html', '');

                const item = document.createElement('div');
                item.className = 'dock-item item-hidden'; // Start hidden (opacity 0)
                item.dataset.index = i;
                item.dataset.title = pageTitle;

                const iframe = document.createElement('iframe');
                iframe.src = encodeURI(pageUrl);
                item.appendChild(iframe);

                item.onclick = (e) => {
                    e.stopPropagation();
                    swiper.slideTo(i);
                };

                pageDock.appendChild(item);
                dockItemsPool.push(item);
            });
        }

        function updateDock() {
            const totalSlides = slideConfig.length;
            const currentIndex = swiper.activeIndex;
            const maxItems = 10;

            let start = Math.max(0, currentIndex - Math.floor(maxItems / 2));
            let end = Math.min(totalSlides, start + maxItems);

            if (end - start < maxItems) {
                start = Math.max(0, end - maxItems);
            }

            dockItemsPool.forEach((item, i) => {
                // Ghost Logic: Toggle visibility via class (opacity/z-index)
                // We DO NOT remove from DOM.
                if (i >= start && i < end) {
                    item.classList.remove('item-hidden');
                    if (i === currentIndex) {
                        item.classList.add('current-page');
                    } else {
                        item.classList.remove('current-page');
                    }
                } else {
                    item.classList.add('item-hidden');
                    item.classList.remove('current-page');
                }
            });
        }

        // Initialize once immediately
        initDockPool();

        // Show dock on hover right area
        dockTrigger.addEventListener('mouseenter', () => {
            clearTimeout(dockTimeout);
            pageDock.classList.add('active');
        });

        // Also keep open if hovering the dock itself
        pageDock.addEventListener('mouseenter', () => {
            clearTimeout(dockTimeout);
        });

        // Hide when leaving both
        const hideDock = () => {
            dockTimeout = setTimeout(() => {
                pageDock.classList.remove('active');
            }, 300);
        };

        dockTrigger.addEventListener('mouseleave', hideDock);
        pageDock.addEventListener('mouseleave', hideDock);


        // Fisheye / Magnification Effect
        let rafId;

        pageDock.addEventListener('mousemove', (e) => {
            if (rafId) cancelAnimationFrame(rafId);

            rafId = requestAnimationFrame(() => {
                // Optimization: Ignore hidden items in calculation
                // Note: querySelectorAll('.dock-item') gets all.
                // We use our pool and check class for speed.
                const mouseY = e.clientY;

                dockItemsPool.forEach(item => {
                    if (item.classList.contains('item-hidden')) return;

                    const itemRect = item.getBoundingClientRect();
                    const itemCenterY = itemRect.top + itemRect.height / 2;
                    const dist = Math.abs(mouseY - itemCenterY);

                    let scale = 1;
                    const maxDist = 150;

                    if (dist < maxDist) {
                        const normalized = 1 - (dist / maxDist);
                        const ease = Math.sin(normalized * Math.PI / 2);
                        scale = 1 + (ease * 1.5); // Max scale 2.5x
                    }

                    item.style.setProperty('--scale', scale);
                });
            });
        });

        // Reset sizes when leaving
        pageDock.addEventListener('mouseleave', () => {
            if (rafId) cancelAnimationFrame(rafId);
            dockItemsPool.forEach(item => {
                item.style.setProperty('--scale', 1);
            });
        });
    </script>
</body>

</html>
