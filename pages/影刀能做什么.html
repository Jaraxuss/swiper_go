        /* Custom Font Stacks */
        .font-sans {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Hide scrollbars for clean presentation */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Custom Red Color */
        .text-rpa-red {
            color: #C00000;
        }

        .bg-rpa-red {
            background-color: #C00000;
        }

        .border-rpa-red {
            border-color: #C00000;
        }

        /* Animations */
        @keyframes float-icon {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .animate-float-slow {
            animation: float-icon 4s ease-in-out infinite;
        }

        .animate-float-medium {
            animation: float-icon 3s ease-in-out infinite;
        }

        .animate-float-fast {
            animation: float-icon 2.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(192, 0, 0, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(192, 0, 0, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(192, 0, 0, 0);
            }
        }

        .animate-pulse-ring {
            animation: pulse-ring 2s infinite;
        }

        /* Phone Screen Scroll Animation */
        @keyframes scroll-screen {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .animate-scroll {
            animation: scroll-screen 6s ease-in-out infinite;
        }
    </style>
</head>
