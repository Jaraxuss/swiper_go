<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习路径规划</title>
    <script src="../../lib/tailwind@4.js"></script>
    <link href="../../lib/font-awesome/all.min.css" rel="stylesheet" />
    <link href="../../lib/fonts.css" rel="stylesheet" />
    <style>
        /* 字体设置 */
        .font-sans {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }

        /* 影刀品牌色 */
        .text-rpa-red {
            color: #C00000;
        }

        .bg-rpa-red {
            background-color: #C00000;
        }

        /* 动画基类 */
        .fragment {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .fragment.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 印章特有动画：从上掉落并带有弹性缩放 */
        .stamp-fragment {
            opacity: 0;
            transform: translateY(-100px) scale(2) rotate(-15deg);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stamp-fragment.visible {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(-15deg);
        }

        /* 全屏预览层 */
        #fullscreen-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            cursor: zoom-out;
            padding: 40px;
        }

        #fullscreen-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.3s ease-out;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body
    class="bg-gray-900 flex items-center justify-center h-screen w-screen selection:bg-red-100 selection:text-red-800 font-sans">
    <div id="page-shell" class="flex items-center justify-center h-full w-full">
        <div id="slide-scale-wrapper" class="relative w-[1280px] h-[720px]">

            <!-- 画布容器 -->
            <div id="slide-container"
                class="w-full h-full box-border flex flex-col relative overflow-hidden bg-[#F8F9FA] p-12">
                <!-- 头部标题区 -->
                <header class="relative z-20 mb-8 shrink-0">
                    <h1 class="text-4xl font-bold tracking-tight text-gray-900 mb-2">
                        学习路径规划
                    </h1>
                    <p class="text-xl text-gray-600 font-medium">
                        策略核心：先拿<span class="font-bold text-[#C00000]">「驾照」</span>，再上<span
                            class="font-bold text-[#C00000]">「高速」</span>
                    </p>
                </header>

                <!-- 主要内容区 -->
                <div class="flex-1 flex flex-col gap-6 relative z-20 h-full min-h-0">

                    <!-- 上半部分：策略卡片 (并排) -->
                    <div class="grid grid-cols-2 gap-8 h-auto shrink-0">

                        <!-- 阶段一：线上初级认证 -->
                        <div
                            class="fragment relative bg-white rounded-xl shadow-sm border border-gray-200 p-5 group hover:shadow-md hover:border-teal-200 transition-all duration-300 flex flex-col justify-between overflow-hidden">
                            <!-- 装饰：左侧线条 -->
                            <div
                                class="absolute left-0 top-4 bottom-4 w-1 bg-teal-400 rounded-r opacity-0 group-hover:opacity-100 transition-opacity">
                            </div>

                            <!-- 红色印章 (Fragment 动画) -->
                            <img src="../../assets/两周轻松拿下.png"
                                class="fragment stamp-fragment absolute top-2 right-4 w-28 h-28 pointer-events-none z-30"
                                alt="印章">

                            <div class="flex items-start gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-teal-50 flex items-center justify-center text-teal-500 text-xl border border-teal-100 shrink-0 mt-1">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span
                                            class="bg-teal-50 text-teal-600 text-[10px] font-bold px-2 py-0.5 rounded border border-teal-100">阶段一</span>
                                        <h3 class="text-lg font-bold text-gray-800">影刀线上初级认证</h3>
                                    </div>
                                    <p class="text-gray-500 text-sm mb-3">掌握基础软件操作</p>

                                    <!-- 类比框 -->
                                    <div
                                        class="bg-gray-50 rounded-lg p-2.5 border border-gray-100 flex items-center gap-2 text-sm text-gray-600 w-full">
                                        <i class="fa-solid fa-lightbulb text-yellow-400"></i>
                                        <span>类比：<span class="font-medium text-gray-800">「先通过驾驶考试」</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 阶段二：开启业务实战开发 -->
                        <div
                            class="fragment relative bg-white rounded-xl shadow-sm border border-gray-200 p-5 group hover:shadow-md hover:border-indigo-200 transition-all duration-300 flex flex-col justify-between">
                            <!-- 装饰：左侧线条 -->
                            <div
                                class="absolute left-0 top-4 bottom-4 w-1 bg-indigo-500 rounded-r opacity-0 group-hover:opacity-100 transition-opacity">
                            </div>

                            <div class="flex items-start gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 text-xl border border-indigo-100 shrink-0 mt-1">
                                    <i class="fa-solid fa-rocket"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span
                                            class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-2 py-0.5 rounded border border-indigo-100">阶段二</span>
                                        <h3 class="text-lg font-bold text-gray-800">开启业务实战开发</h3>
                                    </div>
                                    <p class="text-gray-500 text-sm mb-3">真实业务落地、AI 场景深度构建</p>

                                    <!-- 类比框 -->
                                    <div
                                        class="bg-gray-50 rounded-lg p-2.5 border border-gray-100 flex items-center gap-2 text-sm text-gray-600 w-full">
                                        <i class="fa-solid fa-road text-gray-400"></i>
                                        <span>类比：<span class="font-medium text-gray-800">「领证上路，开启实战征程」</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- 下半部分：课程预览 -->
                    <div class="fragment flex-1 min-h-0">
                        <div
                            class="w-full h-full bg-white rounded-2xl shadow-sm border border-gray-200 p-3 flex flex-col relative overflow-hidden group hover:shadow-lg transition-all duration-500">

                            <!-- 窗口标题栏模拟 -->
                            <div
                                class="h-8 border-b border-gray-100 flex items-center px-3 mb-1 shrink-0 bg-gray-50/50 rounded-t-lg mx-[-12px] mt-[-12px] px-4 pt-3 pb-2 border-b-gray-100">
                                <div class="flex items-center gap-2 text-xs font-medium text-gray-500">
                                    <div class="w-2 h-2 rounded-full bg-teal-500"></div>
                                    <span>影刀学院 · 课程体系全景</span>
                                </div>
                                <div class="ml-auto flex gap-1.5 opacity-50">
                                    <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                                    <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                                    <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                                </div>
                            </div>

                            <!-- 图片容器 -->
                            <div class="flex-1 relative bg-white rounded-lg overflow-hidden flex items-center justify-center cursor-zoom-in"
                                onclick="openFullscreen()">
                                <img src="../../assets/影刀课程体系.jpg" alt="影刀课程体系图"
                                    class="w-full h-full object-contain hover:scale-[1.01] transition-transform duration-500"
                                    onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'flex flex-col items-center justify-center text-gray-400 h-full w-full\'><i class=\'fa-regular fa-image text-5xl mb-2\'></i><span class=\'text-sm\'>请放入影刀课程体系.jpg</span></div>'">
                            </div>

                            <!-- 底部悬浮标签 -->
                            <div onclick="openFullscreen()"
                                class="absolute bottom-4 right-4 bg-gray-800/80 backdrop-blur-sm text-white text-[10px] px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-sm border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                                <i class="fa-solid fa-expand"></i>
                                体系全览
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- 全屏遮罩层 -->
    <div id="fullscreen-overlay" onclick="closeFullscreen()">
        <div class="close-btn" onclick="event.stopPropagation(); closeFullscreen();">
            <i class="fa-solid fa-xmark text-xl"></i>
        </div>
        <img src="../../assets/影刀课程体系.jpg" class="max-w-[90%] max-h-[90%] object-contain" alt="全屏图">
    </div>

    <script src="../../js/slide-core.js"></script>
    <script>
        function openFullscreen() {
            document.getElementById('fullscreen-overlay').classList.add('active');
        }
        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').classList.remove('active');
        }
    </script>
</body>

</html>
