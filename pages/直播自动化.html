<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播自动化 - {{BRAND_NAME}}RPA复刻版</title>
    <script src="../lib/tailwind@4.js"></script>
    <link href="../lib/font-awesome/all.min.css" rel="stylesheet" />
    <link href="../lib/fonts.css" rel="stylesheet" />
    <style>
        /* 字体设置 */
        .font-sans {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }

        /* {{BRAND_NAME}}品牌色 */
        .text-rpa-red {
            color: #C00000;
        }

        .bg-rpa-red {
            background-color: #C00000;
        }

        /* 动画逻辑 */
        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-enter {
            animation: fade-in-up 0.8s ease-out forwards;
        }

        /* 视频容器美化 */
        .video-wrapper {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 8px solid white;
        }
    </style>
</head>

<body
    class="bg-gray-900 flex items-center justify-center h-screen w-screen selection:bg-red-100 selection:text-red-800">
    <div id="page-shell" class="flex items-center justify-center h-full w-full">
        <div id="slide-scale-wrapper" class="relative w-[1280px] h-[720px]">

            <!-- 画布容器 -->
            <div id="slide-container"
                class="w-full h-full box-border flex flex-col relative overflow-hidden bg-[#F8F9FA] p-12">

                <!-- 背景装饰：复刻标志性红色光晕 -->
                <div
                    class="absolute -top-20 -left-20 w-[500px] h-[500px] bg-gradient-to-br from-red-500/5 to-transparent rounded-full blur-3xl pointer-events-none">
                </div>
                <div
                    class="absolute -bottom-20 -right-20 w-[400px] h-[400px] bg-blue-500/5 rounded-full blur-3xl pointer-events-none">
                </div>

                <!-- 头部标题区：复刻垂直红线风格 -->
                <header class="relative z-20 mb-8 shrink-0">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-1.5 h-8 bg-[#C00000] rounded-full"></div>
                        <h1 class="text-4xl font-bold tracking-tight text-gray-900">
                            {{BRAND_NAME}}RPA：直播自动化解决方案
                        </h1>
                    </div>
                    <p class="text-gray-500 ml-5 text-sm font-medium tracking-wide uppercase">
                        Live Streaming Automation with Yingdao RPA
                    </p>
                </header>

                <!-- 主要内容区：左右布局 -->
                <div class="flex-1 flex gap-10 relative z-20 h-full min-h-0">

                    <!-- 左侧：功能提炼 (1/2 宽度) -->
                    <div class="w-1/2 flex flex-col gap-6">

                        <!-- 核心功能卡片组 -->
                        <div class="grid grid-cols-1 gap-4">
                            <!-- 功能1 -->
                            <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm hover:shadow-md transition-all animate-enter"
                                style="animation-delay: 0.1s;">
                                <div class="flex items-center gap-4">
                                    <div
                                        class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center text-rpa-red">
                                        <i class="fa-solid fa-comment-dots text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-bold text-gray-800">实时交互自动化</h3>
                                        <p class="text-sm text-gray-500 mt-1">自动欢迎新进用户、自动回复弹幕、营造直播间热度。</p>
                                    </div>
                                </div>
                            </div>

                            <!-- 功能2 -->
                            <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm hover:shadow-md transition-all animate-enter"
                                style="animation-delay: 0.2s;">
                                <div class="flex items-center gap-4">
                                    <div
                                        class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                                        <i class="fa-solid fa-database text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-bold text-gray-800">数据采集与分析</h3>
                                        <p class="text-sm text-gray-500 mt-1">批量抓取弹幕内容、实时监控主播各项经营指标。</p>
                                    </div>
                                </div>
                            </div>

                            <!-- 功能3 -->
                            <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm hover:shadow-md transition-all animate-enter"
                                style="animation-delay: 0.3s;">
                                <div class="flex items-center gap-4">
                                    <div
                                        class="w-12 h-12 rounded-xl bg-teal-50 flex items-center justify-center text-teal-600">
                                        <i class="fa-solid fa-shop text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-bold text-gray-800">运营管理自动化</h3>
                                        <p class="text-sm text-gray-500 mt-1">根据弹幕自动切换直播画面、一键自动上架直播商品。</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 核心价值条 -->
                        <div class="mt-auto bg-gray-800 text-white p-6 rounded-2xl flex items-center justify-between animate-enter"
                            style="animation-delay: 0.4s;">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                                    <i class="fa-solid fa-clock text-yellow-400"></i>
                                </div>
                                <div>
                                    <div class="text-lg font-bold">7 × 24 小时全天候值守</div>
                                    <div class="text-xs text-gray-400">时刻为您的直播保驾护航</div>
                                </div>
                            </div>
                            <div class="text-rpa-red font-black text-2xl px-4 border-l border-white/10">
                                效率提升 500%
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：视频播放器 (1/2 宽度) -->
                    <div class="w-1/2 flex items-center justify-center animate-enter" style="animation-delay: 0.5s;">
                        <div
                            class="video-wrapper w-full rounded-2xl overflow-hidden bg-black aspect-video relative group">
                            <!-- 视频标签：假设视频文件名为 直播自动化.mp4 -->
                            <video id="main-video" class="w-full h-full object-cover" controls>
                                <source src="../assets/直播自动化.mp4" type="video/mp4">
                                您的浏览器不支持视频播放。
                            </video>

                            <!-- 装饰：模拟专业播放器边框 -->
                            <div
                                class="absolute top-4 left-4 flex gap-1.5 opacity-50 group-hover:opacity-100 transition-opacity">
                                <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- 底部页码风格装饰 -->
                <footer
                    class="mt-8 flex justify-between items-center text-[10px] text-gray-400 font-bold tracking-widest uppercase">
                    <div>{{BRAND_NAME}}RPA · 数字化转型系列</div>
                    <div class="flex items-center gap-2">
                        <span class="w-8 h-px bg-gray-200"></span>
                        PAGE 08
                    </div>
                </footer>

            </div>
        </div>
    </div>

    <script src="../js/slide-core.js"></script>
</body>

</html>
