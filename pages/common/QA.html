<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q&A 章节说明</title>
  <script src="../../lib/tailwind@4.js"></script>
  <link href="../../lib/font-awesome/all.min.css" rel="stylesheet" />
  <link href="../../lib/fonts.css" rel="stylesheet" />
  <style>
    /* Custom Font Stacks */
    .font-sans {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Hide scrollbars for clean presentation */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Animations - Simplified for static divider */
    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 0.1;
      }

      50% {
        opacity: 0.2;
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 4s ease-in-out infinite;
    }
  </style>
</head>

<body class="font-sans text-gray-800 antialiased selection:bg-red-100 selection:text-red-800">
  <div id="page-shell" class="w-screen h-screen flex items-center justify-center bg-gray-900">
    <div id="slide-scale-wrapper" class="relative w-[1280px] h-[720px]">

      <!-- Surface Background -->
      <div id="slide-container"
        class="w-[1280px] h-[720px] box-border flex flex-col relative overflow-hidden bg-[#F8F9FA] p-12">

        <!-- Global Layer (Decorative) -->
        <div
          class='absolute top-0 left-0 w-[800px] h-[800px] bg-gradient-to-r from-[#C00000]/5 to-transparent rounded-full blur-3xl -translate-y-1/4 -translate-x-1/4 z-0 pointer-events-none'>
        </div>

        <!-- Main Content Area: Centered Text -->
        <div class="flex-1 flex items-center justify-center relative z-20">

          <div class="text-center">
            <!-- Large, Primary Title -->
            <h1 class="text-[120px] font-extrabold tracking-tight text-gray-900 leading-none mb-6">
              Q&A
            </h1>

            <!-- Subtitle / Divider Line -->
            <div class="h-1 w-24 mx-auto bg-[#C00000] rounded-full mb-8 animate-pulse-subtle"></div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="../../js/slide-core.js"></script>
</body>

</html>
