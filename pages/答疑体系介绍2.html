<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影刀学习卡壳了，怎么办？</title>
    <script src="../lib/tailwind@4.js"></script>
    <link href="../lib/font-awesome/all.min.css" rel="stylesheet" />
    <link href="../lib/fonts.css" rel="stylesheet" />
    <style>
        /* Custom Font Stacks */
        .font-sans {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Custom Colors */
        .text-rpa-red {
            color: #C00000;
        }

        .bg-rpa-red {
            background-color: #C00000;
        }

        .border-rpa-red {
            border-color: #C00000;
        }

        /* Animations */
        @keyframes float-chat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        .animate-chat {
            animation: float-chat 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="font-sans text-gray-800 antialiased selection:bg-red-100 selection:text-red-800">
    <div id="page-shell" class="w-screen h-screen flex items-center justify-center bg-gray-900">
        <!-- 设定幻灯片固定尺寸 (1280x720) -->
        <div id="slide-scale-wrapper" class="relative w-[1280px] h-[720px]">
            <div id="slide-container"
                class="w-[1280px] h-[720px] box-border flex flex-col relative overflow-hidden bg-[#F8F9FA] p-12">

                <!-- Global Layer (Decorative Red Blur) -->
                <div
                    class='absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-b from-[#C00000]/5 to-transparent rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 z-0 pointer-events-none'>
                </div>

                <!-- Header -->
                <header class="relative z-20 mb-8 shrink-0 flex flex-col items-start gap-4">
                    <!-- Title -->
                    <div>
                        <h1 class="text-4xl font-bold tracking-tight text-gray-900 relative inline-block">
                            影刀学习卡壳了，怎么办？
                            <span
                                class="absolute -bottom-3 left-0 w-full h-1.5 bg-[#C00000] rounded-full opacity-80"></span>
                        </h1>
                    </div>

                    <!-- Subtitle / Description -->
                    <p class="text-xl text-gray-600 leading-relaxed max-w-5xl mt-2">
                        影刀搭建了<span
                            class="text-[#C00000] font-bold mx-1">「帮助中心、开发者社区、在线工单系统、专属服务群」</span>，四位一体式问题解决机制，分别面向问题自主查询，问题实时响应以及疑难杂症问题解决。
                    </p>
                </header>

                <!-- Main Content Grid (2x2 Layout) -->
                <div class="flex-1 grid grid-cols-2 grid-rows-2 gap-6 relative z-20 h-full min-h-0 pb-2">

                    <!-- Card 1: 帮助文档 (需放入原图) -->
                    <div
                        class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col group hover:shadow-md hover:-translate-y-1 transition-all duration-300">
                        <!-- Image Container (Cropped) -->
                        <div class="flex-1 bg-gray-100 rounded-lg mb-3 relative overflow-hidden border border-gray-100">
                            <!-- User Instruction: Place 'help_center.jpg' in the same folder -->
                            <img src="../assets/help_center.png" alt="影刀帮助中心（请确保文件名是 help_center.jpg）"
                                class="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-105"
                                onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full flex flex-col items-center justify-center text-gray-400 bg-gray-50\'><i class=\'fa-solid fa-image text-3xl mb-2\'></i><span class=\'text-xs\'>请放入 help_center.jpg</span></div>'">
                        </div>
                        <!-- Label -->
                        <div class="flex items-center justify-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                            <h3 class="text-lg font-bold text-gray-800">影刀帮助文档</h3>
                        </div>
                    </div>

                    <!-- Card 2: 开发者社区 (需放入原图) -->
                    <div
                        class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col group hover:shadow-md hover:-translate-y-1 transition-all duration-300">
                        <!-- Image Container (Cropped) -->
                        <div class="flex-1 bg-gray-100 rounded-lg mb-3 relative overflow-hidden border border-gray-100">
                            <!-- User Instruction: Place 'community.jpg' in the same folder -->
                            <img src="../assets/community.png" alt="开发者社区（请确保文件名是 community.jpg）"
                                class="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-105"
                                onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full flex flex-col items-center justify-center text-gray-400 bg-gray-50\'><i class=\'fa-solid fa-image text-3xl mb-2\'></i><span class=\'text-xs\'>请放入 community.jpg</span></div>'">
                        </div>
                        <!-- Label -->
                        <div class="flex items-center justify-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-orange-400"></div>
                            <h3 class="text-lg font-bold text-gray-800">开发者社区</h3>
                        </div>
                    </div>

                    <!-- Card 3: 在线工单系统 (纯CSS绘制) -->
                    <div
                        class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col group hover:shadow-md hover:-translate-y-1 transition-all duration-300">
                        <!-- CSS Drawing: Chat UI -->
                        <div
                            class="flex-1 bg-gray-50 rounded-lg mb-3 relative overflow-hidden border border-gray-100 p-4 flex flex-col gap-3">
                            <!-- Header Bar -->
                            <div
                                class="absolute top-0 left-0 right-0 h-8 bg-white border-b border-gray-200 flex items-center px-3 justify-between z-10">
                                <span class="text-[10px] font-bold text-gray-500">工单 #29381 - 网页抓取异常</span>
                                <div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                            </div>
                            <div class="mt-6 w-full flex flex-col gap-3">
                                <!-- User Msg -->
                                <div class="flex items-start gap-2 self-end max-w-[90%]">
                                    <div
                                        class="bg-blue-500 text-white p-2 rounded-l-xl rounded-tr-xl text-[10px] shadow-sm">
                                        你好，这个网页的数据抓取不到，报错 Selector Not Found
                                    </div>
                                    <div
                                        class="w-6 h-6 rounded-full bg-gray-200 shrink-0 border border-white shadow-sm overflow-hidden">
                                        <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User">
                                    </div>
                                </div>
                                <!-- Support Msg -->
                                <div class="flex items-start gap-2 max-w-[90%] animate-chat">
                                    <div
                                        class="w-6 h-6 rounded-full bg-rpa-red shrink-0 flex items-center justify-center text-white text-[8px] border border-white shadow-sm">
                                        <i class="fa-solid fa-robot"></i>
                                    </div>
                                    <div
                                        class="bg-white border border-gray-200 text-gray-700 p-2 rounded-r-xl rounded-tl-xl text-[10px] shadow-sm">
                                        <p class="mb-1">您好，建议使用<span class="text-rpa-red font-bold">【元素捕获】</span>重新定位。
                                        </p>
                                        <div
                                            class="w-full h-12 bg-gray-100 rounded border border-gray-200 mt-1 flex items-center justify-center text-gray-400 text-[8px]">
                                            <i class="fa-solid fa-image mr-1"></i> 示例截图.png
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Label -->
                        <div class="flex items-center justify-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-purple-400"></div>
                            <h3 class="text-lg font-bold text-gray-800">在线工单系统</h3>
                        </div>
                    </div>

                    <!-- Card 4: 专属服务群 (纯CSS绘制) -->
                    <div
                        class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col group hover:shadow-md hover:-translate-y-1 transition-all duration-300">
                        <!-- CSS Drawing: WeChat Dark Mode -->
                        <div
                            class="flex-1 bg-[#1f1f1f] rounded-lg mb-3 relative overflow-hidden border border-gray-100 p-3 flex flex-col">
                            <!-- WeChat Header -->
                            <div
                                class="flex items-center justify-between text-gray-300 mb-3 border-b border-gray-700 pb-2">
                                <div class="flex items-center gap-1">
                                    <i class="fa-solid fa-angle-left text-xs"></i>
                                    <span class="text-[10px] font-bold text-white">严料坊&影刀服务群 (158)</span>
                                </div>
                                <i class="fa-solid fa-ellipsis text-xs"></i>
                            </div>
                            <!-- Chat Area -->
                            <div class="flex-1 flex flex-col gap-3 overflow-hidden">
                                <!-- Msg 1 -->
                                <div class="flex gap-2">
                                    <div
                                        class="w-6 h-6 rounded bg-orange-500 shrink-0 flex items-center justify-center text-white text-[8px] font-bold">
                                        PM</div>
                                    <div class="flex flex-col gap-0.5 max-w-[80%]">
                                        <span class="text-[8px] text-gray-500">产品经理</span>
                                        <div
                                            class="bg-[#2c2c2c] text-gray-200 p-1.5 rounded text-[9px] border border-gray-700">
                                            @所有人 新版本 v5.3 已发布！
                                        </div>
                                    </div>
                                </div>
                                <!-- Msg 2 (Me/User) -->
                                <div class="flex gap-2 flex-row-reverse self-end">
                                    <div
                                        class="w-6 h-6 rounded bg-blue-500 shrink-0 flex items-center justify-center text-white text-[8px] font-bold">
                                        我</div>
                                    <div class="bg-[#95ec69] text-black p-1.5 rounded text-[9px] shadow-sm">
                                        收到，刚试了下，速度快多了！
                                    </div>
                                </div>
                                <!-- Msg 3 (Support) -->
                                <div class="flex gap-2 animate-chat" style="animation-delay: 1s;">
                                    <div
                                        class="w-6 h-6 rounded bg-rpa-red shrink-0 flex items-center justify-center text-white text-[8px] font-bold">
                                        影</div>
                                    <div class="flex flex-col gap-0.5 max-w-[80%]">
                                        <span class="text-[8px] text-gray-500">技术支持-阿影</span>
                                        <div
                                            class="bg-[#2c2c2c] text-gray-200 p-1.5 rounded text-[9px] border border-gray-700">
                                            大家遇到问题随时群里 @我
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Label -->
                        <div class="flex items-center justify-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                            <h3 class="text-lg font-bold text-gray-800">专属服务群</h3>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="../js/slide-core.js"></script>
</body>

</html>
