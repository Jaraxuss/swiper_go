<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>End Slide</title>
    <script src="../lib/tailwind@4.js"></script>
    <link href="../lib/font-awesome/all.min.css" rel="stylesheet" />
    <link href="../lib/fonts.css" rel="stylesheet" />
    <style>
        /* 字体设置 */
        .font-sans {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }
    </style>
</head>

<body
    class="bg-gray-900 flex items-center justify-center h-screen w-screen selection:bg-red-100 selection:text-red-800">
    <div id="page-shell" class="w-full h-full flex items-center justify-center">
        <div id="slide-scale-wrapper" class="relative w-[1280px] h-[720px]">
            <!-- Canvas Background: Light Gray Surface -->
            <div id="slide-container"
                class="w-[1280px] h-[720px] box-border flex flex-col relative overflow-hidden bg-[#F8F9FA]">

                <!-- 1. Global Background Layer (Required) -->
                <div
                    class='absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-b from-red-500/5 to-transparent rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 z-0 pointer-events-none'>
                </div>

                <!-- 2. Decorative Background Elements (Subtle Upward Momentum) -->
                <svg class="absolute inset-0 z-0 opacity-30" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                            <circle cx="2" cy="2" r="1" class="text-gray-200 fill-current" />
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grid-pattern)" />
                </svg>

                <!-- Abstract Rising Shapes -->
                <div
                    class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-teal-50 rounded-full blur-3xl opacity-50 mix-blend-multiply z-0">
                </div>

                <!-- 3. Main Content Container -->
                <div class="relative z-10 flex flex-col items-center justify-center h-full w-full px-20 space-y-12">

                    <div class="flex flex-col items-center space-y-6">
                        <!-- Placeholder for future animation/icon if needed -->
                    </div>

                    <!-- Typography Group -->
                    <div class="text-center max-w-4xl space-y-6">
                        <h1 class="text-[120px] font-black tracking-tight text-[#1F2937] font-sans">
                            感谢观看
                        </h1>

                        <p class="text-[42px] font-medium text-gray-500 leading-relaxed">
                            预祝大家早日成为<span class="text-[#C00000] font-bold mx-2">自动化大神</span>！
                        </p>

                        <div class="w-24 h-2 bg-red-100 mx-auto rounded-full mt-10"></div>
                    </div>

                    <!-- Footer Brand Area -->
                    <div class="absolute bottom-16 flex flex-col items-center space-y-3 opacity-60">
                        <p class="text-sm text-gray-400 font-medium tracking-widest uppercase">影刀RPA · 康健医疗数字化项目组</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="../js/slide-core.js"></script>
</body>

</html>
